[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focuslock"
version = "1.1.1"
description = "A focus blocker for Windows, unlocked by completing tasks in TickTick"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PySide6>=6.10",
    "psutil>=6.0",
    "pywin32>=306; sys_platform=='win32'",
]

[project.scripts]
focuslock = "focuslock.__main__:main"

[tool.setuptools]
packages = ["focuslock", "focuslock.ui"]
